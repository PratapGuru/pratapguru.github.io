    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fbf5e8');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #0e1b20; }
      html[data-theme='light'] { background: #fbf5e8; }
    </style>
